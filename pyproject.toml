[project]
name = "ontheroad"
version = "0.1.0"
description = "On The Road — steer coding agents from your phone"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontheroad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
